name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew makePluginsJson --refresh-dependencies --stacktrace

      - name: Collect build artifacts
        run: |
          mkdir -p build
          find . -maxdepth 3 -name "*.cs3" -exec cp {} build/ \;
          cp plugins.json build/ 2>/dev/null || true
          cp repo.json build/ 2>/dev/null || true
          cp domains.json build/ 2>/dev/null || true
          python -c "import json; p=json.load(open('build/plugins.json')); [x.pop('fileHash', None) for x in p]; json.dump(p, open('build/plugins.json', 'w'), indent=2)"
          ls -la build/

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: false
