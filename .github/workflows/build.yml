name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew makePluginsJson --refresh-dependencies --stacktrace

      - name: Collect build artifacts
        run: |
          mkdir -p build
          find . -name "*.cs3" -exec cp -f {} build/ \;
          find . -name "*.jar" -exec cp -f {} build/ \;
          cp -f build/plugins.json build/ 2>/dev/null || true
          cp -f plugins.json build/ 2>/dev/null || true
          cp -f repo.json build/ 2>/dev/null || true
          cp -f domains.json build/ 2>/dev/null || true
          ls -la build/

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: false
