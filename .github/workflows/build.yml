name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugins
        run: |
          cd src
          chmod +x ./gradlew || true
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          ./gradlew makePluginsJson --stacktrace || ./gradlew make --stacktrace
          mkdir -p $GITHUB_WORKSPACE/builds
          cp -r build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp -r build/plugins.json $GITHUB_WORKSPACE/builds/ || true
          cp -r build/repo.json $GITHUB_WORKSPACE/builds/ || true

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: builds
          clean: false
