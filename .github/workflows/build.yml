name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: |
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm -f $GITHUB_WORKSPACE/builds/*.jar || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --refresh-dependencies --stacktrace
          ./gradlew ensureJarCompatibility || true
          find . -name "*.cs3" -exec cp -f {} $GITHUB_WORKSPACE/builds/ \;
          find . -name "*.jar" -exec cp -f {} $GITHUB_WORKSPACE/builds/ \;
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f repo.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f domains.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/builds/

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push -u origin builds --force
